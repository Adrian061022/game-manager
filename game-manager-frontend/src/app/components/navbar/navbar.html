<nav class="navbar">
  <div class="container">
    <div class="navbar-brand">
      <a routerLink="/" class="logo">
        <span class="logo-icon">&#9679;</span>
        <span class="logo-text">Game<span>Manager</span></span>
      </a>
    </div>

    <div class="navbar-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        Főoldal
      </a>

      <div *ngIf="authService.isLoggedIn" class="nav-links">
        <a *ngIf="authService.isAdmin" routerLink="/admin/game/new" routerLinkActive="active" class="nav-link">
          + Játék hozzáadása
        </a>
        <a *ngIf="authService.isAdmin" routerLink="/admin/transactions" routerLinkActive="active" class="nav-link">
          Tranzakciók
        </a>
        <span class="nav-balance" title="Egyenleg">{{ (authService.currentUserValue?.balance ?? 0) | number:'1.0-0' }} Ft</span>
        <button class="nav-cart" (click)="showCart = true" title="Kosár">
          🛒
          <span class="cart-badge" *ngIf="cartService.count > 0">{{ cartService.count }}</span>
        </button>
        <a routerLink="/profile" class="nav-avatar" title="Profilom">
          <img [src]="getAvatarUrl()" [alt]="authService.currentUserValue?.name" class="nav-avatar-img" />
          <span class="nav-username">{{ authService.currentUserValue?.name }}</span>
        </a>
        <button (click)="logout()" class="btn-logout">Kijelentk.</button>
      </div>

      <div *ngIf="!authService.isLoggedIn" class="nav-links">
        <a routerLink="/login" routerLinkActive="active" class="nav-link">Bejelentkezés</a>
        <a routerLink="/register" routerLinkActive="active" class="nav-link btn-register">Regisztráció</a>
      </div>
    </div>
  </div>
</nav>

<app-cart-modal *ngIf="showCart" (close)="showCart = false"></app-cart-modal>
