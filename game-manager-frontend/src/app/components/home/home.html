<div class="home-container">
  <div class="container">
    <div class="header-actions">
      <div class="page-header">
        <h1>Játékok</h1>
        <p class="subtitle" *ngIf="total > 0">{{ total }} játék elérhető</p>
      </div>
      <a *ngIf="authService.isAdmin" routerLink="/admin/game/new" class="btn-add">
        + Új játék
      </a>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading">
      <div class="spinner"></div>
      <p>Loading games...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage && !isLoading" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && games.length === 0 && !errorMessage" class="empty-state">
      <h2>Nincs megjeleníthető játék</h2>
      <p>Adj hozzá egyet!</p>
      <a *ngIf="authService.isAdmin" routerLink="/admin/game/new" class="btn-add">
        + Új játék
      </a>
    </div>

    <!-- Games Grid -->
    <div *ngIf="!isLoading && games.length > 0" class="games-grid">
      <div *ngFor="let game of games" class="game-card" (click)="viewGame(game.id)">
        <div class="game-image">
          <img 
            [src]="game.cover_image || 'https://via.placeholder.com/460x215/1a1a2e/16213e?text=No+Image'" 
            [alt]="game.title"
            loading="lazy"
          />
          <div class="game-overlay">
            <span class="view-details">View Details</span>
          </div>
        </div>
        
        <div class="game-info">
          <h3 class="game-title">{{ game.title }}</h3>
          <p class="game-category">{{ game.category.name }}</p>
          <div class="game-footer">
            <span class="game-price">{{ game.price }} Ft</span>
            <button
              *ngIf="authService.isAdmin"
              (click)="deleteGame(game.id, game.title); $event.stopPropagation()"
              class="btn-delete"
              title="Törlés"
            >✕</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div *ngIf="!isLoading && games.length > 0 && lastPage > 1" class="pagination">
      <button
        (click)="previousPage()"
        [disabled]="currentPage === 1"
      >
        &larr; Előző
      </button>
      
      <span class="page-info">{{ currentPage }} / {{ lastPage }}</span>
      
      <button
        (click)="nextPage()"
        [disabled]="currentPage === lastPage"
      >
        Következő &rarr;
      </button>
    </div>
  </div>
</div>
