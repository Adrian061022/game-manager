<div class="home-container">
  <div class="container">
    <div class="header-actions">
      <div class="page-header">
        <h1>Játékok</h1>
        <p class="subtitle" *ngIf="total > 0">{{ total }} játék elérhető</p>
      </div>
      <a *ngIf="authService.isAdmin" routerLink="/admin/game/new" class="btn-add">
        + Új játék
      </a>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <!-- Search -->
      <div class="filter-group filter-search">
        <span class="filter-icon">🔍</span>
        <input
          type="text"
          class="filter-input"
          placeholder="Keresés cím vagy leírás alapján..."
          [(ngModel)]="filters.search"
          (ngModelChange)="onSearchChange()"
        />
      </div>

      <!-- Category -->
      <div class="filter-group">
        <select class="filter-select" [(ngModel)]="filters.category_id" (ngModelChange)="onFilterChange()">
          <option [ngValue]="null">Összes kategória</option>
          <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
        </select>
      </div>

      <!-- Sort field -->
      <div class="filter-group">
        <select class="filter-select" [(ngModel)]="filters.sort_by" (ngModelChange)="onFilterChange()">
          <option value="created_at">Dátum</option>
          <option value="title">Cím (ÁBC)</option>
          <option value="price">Ár</option>
        </select>
      </div>

      <!-- Sort order -->
      <div class="filter-group">
        <select class="filter-select" [(ngModel)]="filters.sort_order" (ngModelChange)="onFilterChange()">
          <option value="desc" *ngIf="filters.sort_by === 'created_at'">Legújabb</option>
          <option value="asc"  *ngIf="filters.sort_by === 'created_at'">Legrégebbi</option>
          <option value="asc"  *ngIf="filters.sort_by === 'title'">A → Z</option>
          <option value="desc" *ngIf="filters.sort_by === 'title'">Z → A</option>
          <option value="asc"  *ngIf="filters.sort_by === 'price'">Legolcsóbb</option>
          <option value="desc" *ngIf="filters.sort_by === 'price'">Legdrágább</option>
        </select>
      </div>

      <!-- Price range -->
      <div class="filter-group filter-price">
        <input
          type="number"
          class="filter-input filter-input-price"
          placeholder="Min ár (Ft)"
          [(ngModel)]="filters.min_price"
          (ngModelChange)="onFilterChange()"
          min="0"
        />
        <span class="price-sep">–</span>
        <input
          type="number"
          class="filter-input filter-input-price"
          placeholder="Max ár (Ft)"
          [(ngModel)]="filters.max_price"
          (ngModelChange)="onFilterChange()"
          min="0"
        />
      </div>

      <!-- Reset button -->
      <button
        *ngIf="hasActiveFilters"
        class="btn-reset"
        (click)="resetFilters()"
        title="Szűrők törlése"
      >
        ✕ Törlés
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading">
      <div class="spinner"></div>
      <p>Loading games...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage && !isLoading" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && games.length === 0 && !errorMessage" class="empty-state">
      <div class="empty-icon">🎮</div>
      <h2>Nincs megjeleníthető játék</h2>
      <p *ngIf="hasActiveFilters">Próbálj más szűrési feltételeket!</p>
      <p *ngIf="!hasActiveFilters">Adj hozzá egyet!</p>
      <button *ngIf="hasActiveFilters" class="btn-reset btn-reset-lg" (click)="resetFilters()">Szűrők törlése</button>
      <a *ngIf="!hasActiveFilters && authService.isAdmin" routerLink="/admin/game/new" class="btn-add">
        + Új játék
      </a>
    </div>

    <!-- Games Grid -->
    <div *ngIf="!isLoading && games.length > 0" class="games-grid">
      <div *ngFor="let game of games" class="game-card" (click)="viewGame(game.id)">
        <div class="game-image">
          <img 
            [src]="game.cover_image || 'https://via.placeholder.com/460x215/1a1a2e/16213e?text=No+Image'" 
            [alt]="game.title"
            loading="lazy"
          />
          <div class="game-overlay">
            <span class="view-details">View Details</span>
          </div>
        </div>
        
        <div class="game-info">
          <h3 class="game-title">{{ game.title }}</h3>
          <p class="game-category">{{ game.category.name }}</p>
          <div class="game-footer">
            <span class="game-price">{{ game.price }} Ft</span>
            <button
              *ngIf="authService.isAdmin"
              (click)="deleteGame(game.id, game.title); $event.stopPropagation()"
              class="btn-delete"
              title="Törlés"
            >✕</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div *ngIf="!isLoading && games.length > 0 && lastPage > 1" class="pagination">
      <button
        (click)="previousPage()"
        [disabled]="currentPage === 1"
      >
        &larr; Előző
      </button>
      
      <span class="page-info">{{ currentPage }} / {{ lastPage }}</span>
      
      <button
        (click)="nextPage()"
        [disabled]="currentPage === lastPage"
      >
        Következő &rarr;
      </button>
    </div>
  </div>
</div>
